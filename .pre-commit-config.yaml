repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^web/dist/
      - id: end-of-file-fixer
        exclude: ^web/dist/
      - id: trailing-whitespace
        exclude: ^web/dist/
      - id: check-added-large-files
        args: ["--maxkb=5120"]
        exclude: ^web/dist/
      - id: detect-private-key

  # ruff, mypy and import-linter run from the uv-locked environment so the hooks and CI
  # always use the same tool versions as `uv run`.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict (app, activities, fixtures)
        entry: uv run mypy --strict app activities fixtures
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import-linter layering
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^app/
