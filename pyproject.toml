[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "uaf"
version = "0.1.0"
description = "WorkTree - Python/FastAPI MVP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "UAF Build Agent" }]
dependencies = [
  "alembic>=1.14",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "openpyxl>=3.1",
  "oracledb>=2.5",
  "pandas>=2.2",
  "paramiko>=3.5",
  "playwright>=1.48",
  "psutil>=6.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyarrow>=18.0",
  "python-calamine>=0.3",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "pyzipper>=0.3.6",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32",
  "websockets>=13.0",
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
vault = ["hvac>=2.3"]
rabbitmq = ["aio-pika>=9.5"]
otel = ["opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28"]

[project.scripts]
uaf = "app.cli:main"

[dependency-groups]
dev = [
  "import-linter>=2.1",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.118",
  "ruff>=0.8",
  "types-psutil>=6.0",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "activities"]

[tool.uv]
package = true
python-preference = "only-managed"
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "runtime", "fixtures/generated", "tests/generated", "app/api/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC"]
ignore = [
  "E501",
  "B008",   # FastAPI Depends() in defaults is the documented pattern
  "S101",   # asserts are how tests and internal invariants are written
  "S105",   # false positives on enum/field names containing the word "token"
  "S106",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108", "S311", "S324", "S603", "S607", "S608"]
"app/workers/**" = ["S603"]
"app/security/passwords.py" = ["S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "activities", "fixtures"]
exclude = ["app/api/generated"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["pyzipper.*", "calamine.*", "apscheduler.*", "oracledb.*", "paramiko.*", "hvac.*", "pandas.*", "openpyxl.*", "xlsxwriter.*", "pyarrow.*", "opentelemetry.*", "aio_pika.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "fixtures.*"]
disallow_untyped_decorators = false

# Paramiko ships no type information. The fake server is the only class-based use; keep
# strict checking everywhere else rather than sprinkling unchecked assignments with casts.
[[tool.mypy.overrides]]
module = ["fixtures.fake_sftp"]
disallow_subclassing_any = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running acceptance and performance tests",
  "e2e: browser end-to-end tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:apscheduler.*",
  "ignore::DeprecationWarning:webview.*",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/api/generated/*", "app/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> engine -> bus/workers -> adapters -> domain"
type = "layers"
layers = [
  "app.api",
  "app.services",
  "app.engine",
  "app.workers",
  "app.audit",
  "app.security",
  "app.bus",
  "app.adapters",
  "app.domain",
]
